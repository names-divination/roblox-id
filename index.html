<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 TRUBL - Roblox ID Finder</title>
    <style>
        body {
            background-color: #141414;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            background-color: #141414;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            transition: border 0.3s;
        }
        input[type="text"]:focus {
            border: 1px solid #d4af37;
        }
        button {
            width: 96%;
            padding: 12px;
            background-color: #141414;
            color: #fff;
            border: 1px solid #d4af37;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #d4af37;
            color: #141414;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #282828;
            border-radius: 6px;
            display: none;
            border: 1px solid #3c3c3c;
        }
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background-color: #141414;
            margin: 10px auto;
            display: block;
        }
        .id-text {
            font-size: 22px;
            color: #d4af37;
            font-weight: bold;
            margin: 10px 0;
            user-select: all;
        }
        .copy-btn {
            width: 80%;
            padding: 8px;
            font-size: 13px;
            margin-top: 10px;
            margin-bottom: 15px;
            background-color: #1e1e1e;
            border: 1px solid #d4af37;
            color: #d4af37;
        }
        .copy-btn.success {
            background-color: #2e5a2e;
            border-color: #4caf50;
            color: #fff;
        }
        .error {
            color: #ff3333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 ROBLOX ID FINDER</h1>
    <p>ユーザー名（文字列）を入力すると、登録に必要な数字のIDを表示します。</p>
    
    <input type="text" id="username" placeholder="ユーザー名を入力..." autocomplete="off">
    <button onclick="findRobloxId()">検索する</button>

    <div id="resultBox" class="result-box">
        <div id="avatarContainer"></div>
        
        <div id="resultTitle" style="font-size: 12px; color: #aaa; margin-top: 10px;">あなたの数字のID:</div>
        <div id="idResult" class="id-text">--------</div>
        
        <button id="copyBtn" class="copy-btn" onclick="copyToClipboard()">📋 IDをコピーする</button>
        
        <div style="font-size: 11px; color: #888;">上記をコピーして管理者に送ってください</div>
    </div>
</div>

<script>
// ⚠️ ここに作成した Cloudflare Worker の URL を貼り付けてください（末尾の / は不要）
const WORKER_URL = "https://userid.fuckingskid.workers.dev/";

let currentUserId = "";

async function findRobloxId() {
    const username = document.getElementById('username').value.trim();
    const resultBox = document.getElementById('resultBox');
    const idResult = document.getElementById('idResult');
    const resultTitle = document.getElementById('resultTitle');
    const avatarContainer = document.getElementById('avatarContainer');
    const copyBtn = document.getElementById('copyBtn');

    if (!username) {
        alert('ユーザー名を入力してください。');
        return;
    }

    avatarContainer.innerHTML = "";
    idResult.innerText = "探索中...";
    resultTitle.innerText = "ステータス:";
    resultBox.style.display = "block";
    copyBtn.style.display = "none";

    try {
        // 自前の Worker へ POST リクエストを送る
        const userResponse = await fetch(`${WORKER_URL}/get-user`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ "usernames": [username], "excludeBannedUsers": false })
        });

        const userData = await userResponse.json();

        if (userData.data && userData.data.length > 0) {
            currentUserId = userData.data[0].id;
            const displayName = userData.data[0].displayName;

            try {
                // 自前の Worker へ アバター画像のリクエストを送る
                const thumbResponse = await fetch(`${WORKER_URL}/get-avatar?userId=${currentUserId}`);
                const thumbData = await thumbResponse.json();
                
                if (thumbData.data && thumbData.data.length > 0) {
                    const imgUrl = thumbData.data[0].imageUrl;
                    avatarContainer.innerHTML = `<img src="${imgUrl}" class="avatar-img" alt="Roblox Avatar">`;
                }
            } catch (imgErr) {
                console.error("アバター取得失敗:", imgErr);
            }

            resultTitle.innerText = `${displayName} さんの数字のID:`;
            idResult.innerHTML = `<span class="id-text">${currentUserId}</span>`;
            idResult.className = "id-text";
            copyBtn.style.display = "inline-block";
        } else {
            resultTitle.innerText = "エラー:";
            idResult.innerText = "ユーザーが見つかりません";
            idResult.className = "id-text error";
            copyBtn.style.display = "none";
        }
    } catch (error) {
        resultTitle.innerText = "エラー:";
        idResult.innerText = "通信に失敗しました";
        idResult.className = "id-text error";
        copyBtn.style.display = "none";
        console.error(error);
    }
}

function copyToClipboard() {
    if (!currentUserId) return;
    
    navigator.clipboard.writeText(currentUserId).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "✅ コピーしました！";
        copyBtn.classList.add('success');
        
        setTimeout(() => {
            copyBtn.innerText = "📋 IDをコピーする";
            copyBtn.classList.remove('success');
        }, 2000);
    }).catch(err => {
        console.error('コピー失敗: ', err);
    });
}
</script>

</body>
</html>
